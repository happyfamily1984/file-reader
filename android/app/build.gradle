// 읽어줘 안드로이드 앱: 배포된 웹앱을 웹뷰에 띄우고, 읽기는 앱의 재생 서비스(ReadService)가 맡는다.
// 덕분에 화면이 꺼지거나 다른 앱을 써도 끊기지 않고, 알림창에서 조작할 수 있다.
plugins {
    id 'com.android.application'
}

// 서명 키는 저장소에 넣지 않는다. 빌드할 때 환경 변수로 넘긴다.
def ksFile = System.getenv('READFORME_KEYSTORE')

android {
    namespace 'app.readforme.twa'
    compileSdk 35

    defaultConfig {
        applicationId 'app.readforme.twa'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '1.3.0'
    }
    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('READFORME_KEYSTORE_PASSWORD')
                keyAlias System.getenv('READFORME_KEY_ALIAS') ?: 'readforme'
                keyPassword System.getenv('READFORME_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // 시험용 안드로이드 런타임을 받을 저장소 (기본 저장소에 접속할 수 없는 환경용)
            if (System.getenv('ROBOLECTRIC_REPO')) systemProperty 'robolectric.dependency.repo.url', System.getenv('ROBOLECTRIC_REPO')
            if (System.getenv('HTTPS_PROXY_HOST')) {
                systemProperty 'robolectric.dependency.proxy.host', System.getenv('HTTPS_PROXY_HOST')
                systemProperty 'robolectric.dependency.proxy.port', System.getenv('HTTPS_PROXY_PORT')
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media:media:1.7.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
