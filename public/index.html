<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>읽어줘 - 글 읽어주는 앱</title>
<meta name="theme-color" content="#f1fbf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a16" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="읽어줘">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="파일, 링크, 받은 글, 성경(개역한글)을 소리 내어 읽어주는 앱">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fd1a3"/><stop offset="1" stop-color="#15936e"/></linearGradient>
    <symbol id="i-wave" viewBox="0 0 36 28"><g fill="url(#g-accent)"><rect x="0" y="10" width="4" height="8" rx="2"/><rect x="7" y="4" width="4" height="20" rx="2"/><rect x="14" y="0" width="5" height="28" rx="2.5"/><rect x="22" y="5" width="4" height="18" rx="2"/><rect x="29" y="10" width="4" height="8" rx="2"/></g></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6c.7 0 1.3.3 1.8.8L12 6h6.5A2.5 2.5 0 0 1 21 8.5V17a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M10 14a4.5 4.5 0 0 0 6.400 0l3-3a4.500 4.500 0 0 0-6.400-6.400l-1 1M14 10a4.500 4.500 0 0 0-6.400 0l-3 3a4.500 4.500 0 0 0 6.400 6.400l1-1"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.200v13.600a1 1 0 0 0 1.500.9l11.300-6.800a1 1 0 0 0 0-1.800L9.500 4.300A1 1 0 0 0 8 5.200z"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path fill="currentColor" d="M2.500 5.300C5.500 4 8.600 4.200 11.200 5.900v13.500c-2.600-1.700-5.700-1.900-8.700-.6zM21.500 5.300c-3-1.300-6.100-1.100-8.700.6v13.500c2.600-1.700 5.700-1.900 8.700-.6z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" d="M10.500 17a6.500 6.500 0 1 0 0-13 6.500 6.500 0 0 0 0 13zM15.500 15.500 20 20"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9.500v5a1 1 0 0 0 1 1h3l4.400 3.600a1 1 0 0 0 1.600-.8V5.700a1 1 0 0 0-1.600-.8L7 8.500H4a1 1 0 0 0-1 1z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 0 1 0 6M18.500 6.500a7.500 7.500 0 0 1 0 11"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path stroke="#fff" stroke-width="2.200" stroke-linecap="round" d="M12 11v6M12 7.200v.1"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 9h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1zM16 5V4a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h1"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M13 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6M15 4h5v5M20 4l-8 8"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" d="M4 8h14l-3-3M20 16H6l3 3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 0 0-14.500-4M4 4v4h4M4 13a8 8 0 0 0 14.500 4M20 20v-4h-4"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h10M18 17h2"/><circle cx="15" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 7.500V12l3 2"/></symbol>
  </defs>
</svg>

<header class="top">
  <h1><svg class="logo"><use href="#i-wave"/></svg>읽어줘</h1>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="doc" aria-selected="true">파일·링크</button>
    <button role="tab" data-tab="inbox" aria-selected="false">받은 글<span id="badge" hidden></span></button>
    <button role="tab" data-tab="bible" aria-selected="false">성경</button>
  </nav>
</header>

<main>
  <div id="install" class="install card" hidden>
    <span id="install-msg">홈 화면에 앱으로 설치할 수 있습니다.</span>
    <button type="button" class="btn" id="install-btn">앱 설치</button>
    <a class="btn ghost" id="apk" href="readforme.apk" download hidden>APK 받기</a>
    <button type="button" class="btn ghost" id="install-no" aria-label="설치 안내 닫기">닫기</button>
  </div>

  <section id="tab-doc" class="panel">
    <label class="drop" id="drop">
      <input type="file" id="file" hidden>
      <svg class="ic big"><use href="#i-folder"/></svg>
      <strong>파일 선택</strong>
      <span>PDF · 한글(HWP, HWPX) · 워드 · PPT · 엑셀 · EPUB · HTML · TXT · 사진(JPG 등 글자 인식)<br>여기에 끌어다 놓아도 됩니다</span>
    </label>
    <form id="link-form" class="row">
      <div class="field"><svg class="ic"><use href="#i-link"/></svg><input id="link" type="text" inputmode="url" placeholder="링크 붙여넣기 (https://…)" autocomplete="off" aria-label="링크 주소"></div>
      <button class="btn"><svg class="ic"><use href="#i-play"/></svg>가져오기</button>
    </form>
    <form id="text-form">
      <div class="field area"><svg class="ic"><use href="#i-doc"/></svg><textarea id="text" rows="4" placeholder="읽을 글을 여기에 붙여넣기" aria-label="읽을 글"></textarea></div>
      <button class="btn ghost"><svg class="ic"><use href="#i-speaker"/></svg>이 글 읽기</button>
    </form>
  </section>

  <section id="tab-inbox" class="panel" hidden>
    <p class="note"><svg class="ic"><use href="#i-info"/></svg>Claude 같은 다른 곳에서 아래 주소로 글을 보내면 여기에 도착합니다.</p>
    <div class="card addr">
      <div class="addr-box"><svg class="ic"><use href="#i-link"/></svg><code id="addr"></code></div>
      <div class="row wrap">
        <button type="button" class="btn grow" id="copy-prompt"><svg class="ic"><use href="#i-send"/></svg>Claude에게 줄 지시문 복사</button>
        <button type="button" class="btn ghost" id="copy-addr"><svg class="ic"><use href="#i-copy"/></svg>주소만 복사</button>
        <button type="button" class="btn ghost" id="change-id"><svg class="ic"><use href="#i-swap"/></svg>주소 바꾸기</button>
      </div>
    </div>
    <div class="results-bar">
      <span id="inbox-count">받은 글 없음</span>
      <label class="check"><input type="checkbox" id="auto-read"> 도착하면 바로 읽기</label>
      <button type="button" class="btn ghost" id="refresh"><svg class="ic"><use href="#i-refresh"/></svg>새로고침</button>
    </div>
    <ul id="inbox-list" class="card list" hidden></ul>
  </section>

  <section id="tab-bible" class="panel" hidden>
    <p class="note"><svg class="ic"><use href="#i-book"/></svg>성경전서 개역한글판</p>
    <form id="search-form" class="row">
      <input id="q" type="search" placeholder="검색어 또는 구절 (예: 요 3:16)" aria-label="성경 검색">
      <select id="scope" aria-label="검색 범위"></select>
      <button class="btn"><svg class="ic"><use href="#i-search"/></svg>검색</button>
    </form>
    <form id="range-form" class="card range">
      <select id="book" aria-label="책"></select>
      <div class="row">
        <span class="lbl"><svg class="ic"><use href="#i-flag"/></svg>시작</span>
        <select id="c1" aria-label="시작 장"></select><span>장</span>
        <select id="v1" aria-label="시작 절"></select><span>절</span>
      </div>
      <div class="row">
        <span class="lbl"><svg class="ic"><use href="#i-flag"/></svg>끝</span>
        <select id="c2" aria-label="끝 장"></select><span>장</span>
        <select id="v2" aria-label="끝 절"></select><span>절</span>
      </div>
      <button class="btn"><svg class="ic"><use href="#i-book"/></svg>이 범위 읽기</button>
      <label class="check"><input type="checkbox" id="say-num"> 절 번호도 소리 내어 읽기</label>
    </form>
    <div id="results" hidden>
      <div class="results-bar">
        <span id="count"></span>
        <button type="button" class="btn ghost" id="sel-all">전체 선택</button>
        <button type="button" class="btn" id="read-sel" disabled>선택 구절 읽기</button>
      </div>
      <ul id="hits" class="card list"></ul>
      <button type="button" class="btn ghost" id="more" hidden>더 보기</button>
    </div>
  </section>

  <button type="button" id="now" class="card now" hidden>
    <svg class="ic"><use href="#i-speaker"/></svg>
    <span><small>읽던 글</small><b id="now-title"></b></span>
    <span class="go">열기 ›</span>
  </button>

  <p id="status" role="status" hidden></p>

  <article id="reader" class="card">
    <div class="reader-head">
      <button type="button" id="back" aria-label="이전 화면으로"><svg class="ic"><use href="#i-back"/></svg></button>
      <h2 id="title">읽을 글이 없습니다</h2>
      <div class="font">
        <button type="button" id="font-down" aria-label="글자 작게">가−</button>
        <button type="button" id="font-up" aria-label="글자 크게">가+</button>
      </div>
    </div>
    <div id="body"></div>
  </article>
</main>

<footer class="player">
  <div class="prog">
    <input id="seek" type="range" min="0" max="0" value="0" aria-label="읽는 위치">
    <span id="pos">0 / 0</span>
  </div>
  <div class="ctrl">
    <button type="button" id="prev" aria-label="이전 문장"><svg viewBox="0 0 24 24"><path d="M6 5h2.400v14H6zM20 5.800v12.400a.8.800 0 0 1-1.200.7L9 12.700a.8.800 0 0 1 0-1.400l9.800-6.200a.8.800 0 0 1 1.200.7z"/></svg></button>
    <button type="button" id="play" class="main" aria-label="재생"><svg viewBox="0 0 24 24"><path id="play-icon" d="M7 4v16l14-8z"/></svg></button>
    <button type="button" id="next" aria-label="다음 문장"><svg viewBox="0 0 24 24"><path d="M15.600 5H18v14h-2.400zM4 5.800v12.400a.8.800 0 0 0 1.200.7l9.800-6.200a.8.800 0 0 0 0-1.400L5.200 5.100a.8.800 0 0 0-1.200.7z"/></svg></button>
    <button type="button" id="stop" aria-label="정지"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    <button type="button" id="opts-btn" aria-expanded="true" aria-controls="opts"><svg class="ic"><use href="#i-sliders"/></svg>설정</button>
  </div>
  <div class="opts" id="opts">
    <label>목소리
      <select id="voice"></select>
    </label>
    <label>속도 <output id="rate-out">1.0배</output>
      <input id="rate" type="range" min="0.5" max="3" step="0.1" value="1">
    </label>
    <label>반복
      <select id="repeat">
        <option value="1">1번만</option><option value="2">2번</option><option value="3">3번</option>
        <option value="5">5번</option><option value="10">10번</option><option value="0">계속 반복</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="loop-one"> 지금 문장만 반복</label>
  </div>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
