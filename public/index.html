<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>읽어줘 - 글 읽어주는 앱</title>
<meta name="theme-color" content="#2f5d50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>읽어줘</h1>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="doc" aria-selected="true">파일·링크</button>
    <button role="tab" data-tab="inbox" aria-selected="false">받은 글<span id="badge" hidden></span></button>
    <button role="tab" data-tab="bible" aria-selected="false">성경</button>
  </nav>
</header>

<main>
  <section id="tab-doc" class="panel">
    <label class="drop" id="drop">
      <input type="file" id="file" hidden>
      <strong>파일 선택</strong>
      <span>PDF · 한글(HWP, HWPX) · 워드 · PPT · 엑셀 · EPUB · HTML · TXT · 사진(JPG 등 글자 인식)<br>여기에 끌어다 놓아도 됩니다</span>
    </label>
    <form id="link-form" class="row">
      <input id="link" type="text" inputmode="url" placeholder="링크 붙여넣기 (https://…)" autocomplete="off" aria-label="링크 주소">
      <button class="btn">가져오기</button>
    </form>
    <form id="text-form">
      <textarea id="text" rows="4" placeholder="읽을 글을 여기에 붙여넣기" aria-label="읽을 글"></textarea>
      <button class="btn">이 글 읽기</button>
    </form>
  </section>

  <section id="tab-inbox" class="panel" hidden>
    <p class="note">Claude 같은 다른 곳에서 아래 주소로 글을 보내면 여기에 도착합니다.</p>
    <div class="addr">
      <code id="addr"></code>
      <div class="row wrap">
        <button type="button" class="btn" id="copy-prompt">Claude에게 줄 지시문 복사</button>
        <button type="button" class="btn ghost" id="copy-addr">주소만 복사</button>
        <button type="button" class="btn ghost" id="change-id">주소 바꾸기</button>
      </div>
    </div>
    <div class="results-bar">
      <span id="inbox-count">받은 글 없음</span>
      <label class="check"><input type="checkbox" id="auto-read"> 도착하면 바로 읽기</label>
      <button type="button" class="btn ghost" id="refresh">새로고침</button>
    </div>
    <ul id="inbox-list" hidden></ul>
  </section>

  <section id="tab-bible" class="panel" hidden>
    <p class="note">성경전서 개역한글판</p>
    <form id="search-form" class="row">
      <input id="q" type="search" placeholder="검색어 또는 구절 (예: 사랑, 요 3:16, 시 23편)" aria-label="성경 검색">
      <select id="scope" aria-label="검색 범위"></select>
      <button class="btn">검색</button>
    </form>
    <form id="range-form" class="range">
      <select id="book" aria-label="책"></select>
      <div class="row">
        <span>시작</span>
        <select id="c1" aria-label="시작 장"></select><span>장</span>
        <select id="v1" aria-label="시작 절"></select><span>절</span>
      </div>
      <div class="row">
        <span>끝</span>
        <select id="c2" aria-label="끝 장"></select><span>장</span>
        <select id="v2" aria-label="끝 절"></select><span>절</span>
      </div>
      <button class="btn">이 범위 읽기</button>
    </form>
    <label class="check"><input type="checkbox" id="say-num"> 절 번호도 소리 내어 읽기</label>
    <div id="results" hidden>
      <div class="results-bar">
        <span id="count"></span>
        <button type="button" class="btn ghost" id="sel-all">전체 선택</button>
        <button type="button" class="btn" id="read-sel" disabled>선택 구절 읽기</button>
      </div>
      <ul id="hits"></ul>
      <button type="button" class="btn ghost" id="more" hidden>더 보기</button>
    </div>
  </section>

  <p id="status" role="status" hidden></p>

  <article id="reader">
    <div class="reader-head">
      <h2 id="title">읽을 글이 없습니다</h2>
      <div class="font">
        <button type="button" id="font-down" aria-label="글자 작게">가−</button>
        <button type="button" id="font-up" aria-label="글자 크게">가+</button>
      </div>
    </div>
    <div id="body"><p class="empty">파일을 열거나, 링크나 글을 붙여넣거나, 성경 구절을 골라 보세요.<br>문장을 누르면 그 자리부터 읽습니다.</p></div>
  </article>
</main>

<footer class="player">
  <div class="prog">
    <input id="seek" type="range" min="0" max="0" value="0" aria-label="읽는 위치">
    <span id="pos">0 / 0</span>
  </div>
  <div class="ctrl">
    <button type="button" id="prev" aria-label="이전 문장"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button type="button" id="play" class="main" aria-label="재생"><svg viewBox="0 0 24 24"><path id="play-icon" d="M7 4v16l14-8z"/></svg></button>
    <button type="button" id="next" aria-label="다음 문장"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button type="button" id="stop" aria-label="정지"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
    <button type="button" id="opts-btn" aria-expanded="true" aria-controls="opts">설정</button>
  </div>
  <div class="opts" id="opts">
    <label>목소리
      <select id="voice"></select>
    </label>
    <label>속도 <output id="rate-out">1.0배</output>
      <input id="rate" type="range" min="0.5" max="3" step="0.1" value="1">
    </label>
    <label>반복
      <select id="repeat">
        <option value="1">1번만</option><option value="2">2번</option><option value="3">3번</option>
        <option value="5">5번</option><option value="10">10번</option><option value="0">계속 반복</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="loop-one"> 지금 문장만 반복</label>
  </div>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
